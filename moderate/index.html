<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Moderation · Ummi &amp; Me</title>
<style>
:root{--bg:#fdf8f6;--card:#fff;--ink:#2b2230;--soft:#5d5263;--accent:#c0567a;--line:#eadfe2;--warn:#b3261e;--ok:#2e7d32}
@media(prefers-color-scheme:dark){:root{--bg:#1c171e;--card:#262029;--ink:#f4edf0;--soft:#c9bec6;--accent:#e98aac;--line:#3a3040;--warn:#f28b82;--ok:#81c995}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Naskh Arabic",sans-serif}
main{max-width:760px;margin:0 auto;padding:32px 16px 64px}
h1{font-size:26px;margin:0 0 4px}
.muted{color:var(--soft);font-size:14px}
form,.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:16px}
label{display:block;font-size:14px;color:var(--soft);margin-top:10px}
input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
button{font:inherit;border:0;border-radius:999px;padding:9px 16px;cursor:pointer}
.primary{background:var(--accent);color:#fff}
.remove{background:var(--warn);color:#fff}
.keep{background:transparent;color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tag{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 8px;margin:0 4px 4px 0;color:var(--soft)}
.tag.harm{border-color:var(--warn);color:var(--warn);font-weight:600}
.body{white-space:pre-wrap;word-wrap:break-word;margin:10px 0 4px;font-size:17px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
#msg{margin-top:12px;font-size:14px}
</style>
</head>
<body>
<main>
  <div class="top">
    <div><h1>Moderation</h1><div class="muted">Ummi &amp; Me · reported posts and replies. Review within 24 hours.</div></div>
    <button id="signout" class="keep" hidden>Sign out</button>
  </div>

  <form id="login" hidden>
    <label for="email">Email</label><input id="email" type="email" autocomplete="username" required>
    <label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required>
    <div class="row"><button class="primary" type="submit">Sign in</button></div>
  </form>

  <div id="msg" class="muted"></div>
  <div id="queue"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = supabase.createClient('https://bqghpbdbmshqtzuoarxs.supabase.co', 'sb_publishable_q1YV3TPtguJAoIx2kJrs9w_xFHehtnG');
const $ = id => document.getElementById(id);
const esc = s => (s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const say = (t, bad) => { $('msg').textContent = t; $('msg').style.color = bad ? 'var(--warn)' : ''; };

async function load() {
  const { data: { session } } = await sb.auth.getSession();
  $('login').hidden = !!session; $('signout').hidden = !session; $('queue').innerHTML = '';
  if (!session) { say('Sign in with a moderator account.'); return; }
  const { data: isMod, error: e1 } = await sb.rpc('mod_is_moderator');
  if (e1 || !isMod) { say('This account is not a moderator. Ask the team to add it.', true); return; }
  say('Loading…');
  const { data, error } = await sb.rpc('mod_queue');
  if (error) { say(error.message, true); return; }
  say(data.length ? `${data.length} item${data.length > 1 ? 's' : ''} to review. Self-harm reports are first.` : 'Nothing to review. 🎉');
  $('queue').innerHTML = data.map(r => `
    <div class="card" data-post="${r.post_id ?? ''}" data-reply="${r.reply_id ?? ''}">
      <div>${r.reasons.map(x => `<span class="tag ${x === 'self_harm' ? 'harm' : ''}">${esc(x.replace('_', ' '))}</span>`).join('')}
        <span class="tag">${r.reply_id ? 'reply' : 'post'}</span><span class="tag">circle: ${esc(r.circle_id)}</span>
        ${r.hidden ? '<span class="tag">auto-hidden</span>' : ''}</div>
      <div class="body">${esc(r.body) || '<em>(deleted)</em>'}</div>
      <div class="muted">${r.open_reports} report${r.open_reports > 1 ? 's' : ''} · first ${new Date(r.first_reported).toLocaleString()}
        ${r.author_posts_removed ? ` · author has ${r.author_posts_removed} removed post(s)` : ''}</div>
      ${r.notes.length ? `<div class="muted">Notes: ${r.notes.map(esc).join(' · ')}</div>` : ''}
      ${r.reasons.includes('self_harm') ? '<div class="muted" style="color:var(--warn)">Possible self-harm: follow your safety process before closing.</div>' : ''}
      <div class="row"><button class="remove" data-act="remove">Remove</button><button class="keep" data-act="dismiss">Keep (no violation)</button></div>
    </div>`).join('');
}

$('queue').addEventListener('click', async e => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const card = b.closest('.card');
  b.disabled = true;
  const { error } = await sb.rpc('mod_resolve', { p_post: card.dataset.post || null, p_reply: card.dataset.reply || null, p_action: b.dataset.act });
  if (error) { say(error.message, true); b.disabled = false; return; }
  card.remove(); say('Done.');
});

$('login').addEventListener('submit', async e => {
  e.preventDefault(); say('Signing in…');
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
  if (error) { say(error.message, true); return; }
  $('password').value = ''; load();
});
$('signout').addEventListener('click', async () => { await sb.auth.signOut(); load(); });
load();
</script>
</body>
</html>
